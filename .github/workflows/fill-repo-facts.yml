name: Fill repo facts

# Reads repo facts with this run's own GitHub token and keeps them in the Worker's D1
# table, so players' pools spend none of the Worker's points on them
# (scripts/fill-repo-facts.ts). Needs the CLOUDFLARE_API_TOKEN secret (a token with
# D1 Edit) and the CLOUDFLARE_ACCOUNT_ID variable; without them the run is skipped.

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fill-repo-facts
  cancel-in-progress: false

jobs:
  fill:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npx --yes tsx scripts/fill-repo-facts.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
