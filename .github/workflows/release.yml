name: Release

# Publishing a GitHub release vX.Y.Z publishes github-stars-organizer@X.Y.Z to
# npm, built from that release's tag. npm trusts this workflow by name (a
# "trusted publisher"), so no npm token is stored anywhere. See README, Releasing.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify the publish came from this workflow

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Check the tag matches cli/package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./cli/package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "Release tag $TAG does not match cli/package.json ($version). Bump the version or retag."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build:cli
      - run: npm publish --access public
        working-directory: cli
