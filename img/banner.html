<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stars Organizer Banner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: #0a0a0a;
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner {
      width: 1280px;
      height: 640px;
      background: linear-gradient(135deg, #0a0a0a 0%, #14101a 50%, #0a0a0a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Subtle grid pattern */
    .banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.5;
    }

    /* Purple accent line at top */
    .gold-line {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #a371f7, transparent);
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bottom-section {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: auto;
    }

    .logo {
      font-size: 96px;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #fafafa;
      margin-bottom: 24px;
    }

    .tagline {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #737373;
      margin-bottom: 48px;
      width: 100%;
      text-align: center;
    }

    .features {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 16px;
    }

    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .feature-icon {
      font-size: 28px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .feature-text {
      font-size: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #a3a3a3;
    }

    .feature.accent .feature-icon {
      color: #a371f7;
    }

    .corner {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .corner.top-left { top: 40px; left: 40px; border-right: none; border-bottom: none; }
    .corner.top-right { top: 40px; right: 40px; border-left: none; border-bottom: none; }
    .corner.bottom-left { bottom: 40px; left: 40px; border-right: none; border-top: none; }
    .corner.bottom-right { bottom: 40px; right: 40px; border-left: none; border-top: none; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="gold-line"></div>

    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <div class="content">
      <div class="logo">Stars Organizer</div>
      <div class="bottom-section">
        <div class="tagline">Tame your stars</div>
        <div class="features">
          <div class="feature">
            <div class="feature-icon">⭐</div>
            <div class="feature-text">Import</div>
          </div>
          <div class="feature accent">
            <div class="feature-icon">🗂️</div>
            <div class="feature-text">Lists</div>
          </div>
          <div class="feature">
            <div class="feature-icon">🏷️</div>
            <div class="feature-text">Tag</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
