server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single origin: the SPA is built with an empty VITE_API_URL, so every
    # fetch is a relative /api/... and lands here. This is also why Electric
    # is never exposed — the API proxies it at /api/electric/*.
    location /api/ {
        proxy_pass http://github-stars-organizer-api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Electric shape requests are long-polled; the default 60s read timeout
        # would cut a live subscription every minute.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
