# Answers GET /api/lists?user=<login> for the public demo, which has no server
# of its own. GitHub Lists are GraphQL-only and GraphQL needs a token, so the
# token lives here as a secret instead of in visitors' browsers.
#
#   npx wrangler secret put GITHUB_TOKEN   # fine-grained PAT, public repos read-only
#   npx wrangler deploy
name = "stars-demo-lists"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# /battle and /run are the app's own pages; the Worker passes them through with the
# link-preview tags of the battle or run in the address (src/share.ts).
routes = [
  { pattern = "stars-demo.armanckeser.com/api/*", zone_name = "armanckeser.com" },
  { pattern = "stars-demo.armanckeser.com/battle*", zone_name = "armanckeser.com" },
  { pattern = "stars-demo.armanckeser.com/run*", zone_name = "armanckeser.com" },
  # /team is a finished run's team; the Worker adds the team's tags the same way (src/team.ts).
  { pattern = "stars-demo.armanckeser.com/team*", zone_name = "armanckeser.com" },
]
# The font the share picture is drawn with.
rules = [{ type = "Data", globs = ["**/*.ttf"], fallthrough = true }]
# The counters behind the launch numbers (worker/src/events.ts, read by scripts/stard-counts.mjs).
# Cloudflare creates the dataset on its first write.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "stard_events"
# Short team links (src/team-links.ts). Created once with:
#   npx wrangler d1 create stard
#   npx wrangler d1 migrations apply stard --remote
[[d1_databases]]
binding = "TEAMS"
database_name = "stard"
database_id = "71ec2736-6bdd-43c2-8481-40b2c6547fd4"
migrations_dir = "migrations"
