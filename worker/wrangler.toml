# Answers GET /api/lists?user=<login> for the public demo, which has no server
# of its own. GitHub Lists are GraphQL-only and GraphQL needs a token, so the
# token lives here as a secret instead of in visitors' browsers.
#
#   npx wrangler secret put GITHUB_TOKEN   # fine-grained PAT, public repos read-only
#   npx wrangler deploy
name = "stars-demo-lists"
main = "src/index.ts"
compatibility_date = "2026-10-01"
routes = [{ pattern = "stars-demo.armanckeser.com/api/*", zone_name = "armanckeser.com" }]
